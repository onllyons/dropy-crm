services:
  app:
    build: .
    ports:
      - "8055:8000"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
        db:
          condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: onllyons_en
      DB_USERNAME: dropy_user
      DB_PASSWORD: dropy_pass

    command: bash -lc "sleep 5 && php artisan config:clear && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    command: --sql-mode=""
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: onllyons_en
      MYSQL_USER: dropy_user
      MYSQL_PASSWORD: dropy_pass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 5s
        timeout: 5s
        retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root


volumes:
  db_data:
